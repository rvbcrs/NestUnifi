name: Publish image

# Every change to what goes into the image is tested, built for both processor types and published.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - admin/**
      - suite/**
      - UPSTREAM-LICENSE
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: publish

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nestunifi
  SOURCE: ${{ github.server_url }}/${{ github.repository }}
  DESCRIPTION: Google Nest cameras, doorbells and hubs as ONVIF cameras for UniFi Protect

jobs:
  image:
    runs-on: ubuntu-latest
    # Every action is pinned to an exact commit, so a moved version tag cannot change what publishes the image.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the admin code
        working-directory: admin
        run: PYTHONPATH=.. python3 -B -m unittest test_worker test_setup test_web
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from the date
        id: version
        run: echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      # Without provenance the registry holds only the two platform images, which older Docker versions read.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.date }}
          build-args: |
            NESTUNIFI_VERSION=${{ steps.version.outputs.date }}
            NESTUNIFI_REPOSITORY=${{ github.repository_owner }}/nestunifi
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          annotations: |
            index,manifest:org.opencontainers.image.source=${{ env.SOURCE }}
            index,manifest:org.opencontainers.image.description=${{ env.DESCRIPTION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
