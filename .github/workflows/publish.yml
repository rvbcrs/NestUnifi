name: Publish image

# Every change to what goes into the image is tested, built for both processor types and published.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - admin/**
      - suite/**
      - UPSTREAM-LICENSE
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: publish

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nestunifi
  SOURCE: ${{ github.server_url }}/${{ github.repository }}
  DESCRIPTION: Google Nest cameras, doorbells and hubs as ONVIF cameras for UniFi Protect

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the admin code
        working-directory: admin
        run: PYTHONPATH=.. python3 -B -m unittest test_worker test_setup test_web
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from the date
        id: version
        run: echo "date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
      # Without provenance the registry holds only the two platform images, which older Docker versions read.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.date }}
          labels: org.opencontainers.image.source=${{ env.SOURCE }}
          annotations: |
            index,manifest:org.opencontainers.image.source=${{ env.SOURCE }}
            index,manifest:org.opencontainers.image.description=${{ env.DESCRIPTION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
